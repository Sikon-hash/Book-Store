name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        working-directory: frontend
        run: composer install --no-interaction --prefer-dist

      - name: Compile Java backend
        working-directory: backend
        run: javac -d temp-classes BookStoreServer.java

      - name: Compile Java tests
        working-directory: backend
        run: javac -d temp-classes -cp "temp-classes:lib/*" BookStoreServerTest.java

      - name: Run Java tests with JaCoCo coverage
        working-directory: backend
        run: |
          java -javaagent:lib/jacocoagent.jar=destfile=jacoco.exec \
            -jar lib/junit-platform-console-standalone-1.14.3.jar \
            --class-path temp-classes \
            --scan-class-path

      - name: Generate JaCoCo coverage report
        working-directory: backend
        run: |
          java -cp "lib/*" org.jacoco.cli.internal.Main report jacoco.exec \
            --classfiles temp-classes \
            --sourcefiles . \
            --html coverage-report \
            --csv coverage-report.csv

      - name: Check coverage >= 80%
        working-directory: backend
        run: |
          COVERAGE=$(grep -oP 'total,[^,]*,[^,]*,\K[^,]*' coverage-report.csv | head -1)
          COVERAGE_INT=${COVERAGE%.*}
          echo "Instruction coverage: $COVERAGE%"
          if [ "$COVERAGE_INT" -lt 80 ]; then
            echo "❌ Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets threshold"

      - name: Start Java backend
        working-directory: backend
        run: |
          java -cp temp-classes BookStoreServer &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"product_id":"B001","quantity":1}' \
            http://localhost:8080/api/calculate || exit 1

      - name: Start PHP frontend
        working-directory: frontend
        run: |
          php -S localhost:8000 > /dev/null 2>&1 &
          sleep 2

      - name: Run PHPUnit tests
        working-directory: frontend
        run: vendor/bin/phpunit

      - name: Run Cypress E2E tests
        run: npx cypress run

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/coverage-report/

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
